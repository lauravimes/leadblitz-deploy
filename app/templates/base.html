<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LeadBlitz{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  {% if user %}
  <nav>
    <div class="{% block container_class %}container{% endblock %}">
      <a href="/" class="logo">LeadBlitz</a>
      <button class="hamburger" type="button" data-menu-toggle="nav-menu" aria-label="Menu" aria-controls="nav-menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-menu">
        <div class="nav-dropdown">
          <button class="nav-dropdown-toggle {{ 'active' if active_page in ['dashboard','search','leads','email','sms','campaigns'] }}" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="tools-menu">
            Tools <span class="caret" aria-hidden="true">▾</span>
          </button>
          <div class="nav-dropdown-menu" id="tools-menu">
            <a href="/dashboard" class="{{ 'active' if active_page == 'dashboard' }}">Dashboard</a>
            <a href="/search" class="{{ 'active' if active_page == 'search' }}">Search</a>
            <a href="/leads" class="{{ 'active' if active_page == 'leads' }}">Leads</a>
            <a href="/campaigns" class="{{ 'active' if active_page == 'campaigns' }}">Campaigns</a>
            <a href="/import">Import CSV</a>
            <div class="menu-sep" role="separator"></div>
            <a href="/email" class="{{ 'active' if active_page == 'email' }}">Email</a>
            <a href="/sms" class="{{ 'active' if active_page == 'sms' }}">SMS</a>
          </div>
        </div>
        <a href="/blog" class="{{ 'active' if active_page == 'blog' }}">Blog</a>
        <a href="/credits" class="{{ 'active' if active_page == 'credits' }}">
          Credits <span class="credit-badge" id="nav-credits" hx-get="/api/credits/balance" hx-trigger="load, creditsChanged from:body" hx-swap="innerHTML" aria-live="polite">—</span>
        </a>
        <a href="/settings" class="{{ 'active' if active_page == 'settings' }}">Settings</a>
        {% if user.is_admin %}<a href="/admin" class="{{ 'active' if active_page == 'admin' }}">Admin</a>{% endif %}
        <a href="#" hx-post="/auth/logout">Logout</a>
      </div>
    </div>
  </nav>
  {% endif %}

  <main>
    <div class="{{ self.container_class() }}" id="content">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="app-footer">
    <div class="container">
      <a href="/privacy">Privacy</a>
      <a href="/contact">Contact</a>
    </div>
  </footer>

  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>

  <script>
  (function(){
    /* --- Toggles: hamburger, Tools dropdown, any [data-menu-toggle] --- */
    function setExpanded(btn, open){ btn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
    document.querySelectorAll('[data-menu-toggle]').forEach(function(btn){
      var menu = document.getElementById(btn.getAttribute('data-menu-toggle'));
      if(!menu) return;
      btn.addEventListener('click', function(){
        var open = menu.classList.toggle('open');
        btn.classList.toggle('open', open);
        setExpanded(btn, open);
      });
    });
    var toggle = document.querySelector('.nav-dropdown-toggle');
    var dropdown = toggle && toggle.parentElement;
    if(toggle){
      toggle.addEventListener('click', function(e){
        e.stopPropagation();
        setExpanded(toggle, dropdown.classList.toggle('open'));
      });
      document.addEventListener('click', function(e){
        if(!dropdown.contains(e.target)){ dropdown.classList.remove('open'); setExpanded(toggle, false); }
      });
    }

    /* --- Global toast --- */
    window.showToast = function(message, kind){
      var stack = document.getElementById('toast-stack');
      if(!stack) return;
      var t = document.createElement('div');
      t.className = 'toast' + (kind === 'info' ? ' toast-info' : '');
      var text = document.createElement('span');
      text.textContent = message;
      var close = document.createElement('button');
      close.type = 'button'; close.setAttribute('aria-label', 'Dismiss'); close.innerHTML = '&times;';
      close.addEventListener('click', function(){ t.remove(); });
      t.appendChild(text); t.appendChild(close);
      stack.appendChild(t);
      setTimeout(function(){ t.remove(); }, kind === 'info' ? 4000 : 8000);
    };

    function messageFromXhr(xhr){
      var status = xhr ? xhr.status : 0;
      var body = xhr && typeof xhr.responseText === 'string' ? xhr.responseText.trim() : '';
      // Short error partials (partials/error.html, inline .error-msg) are safe to show as text.
      if(body && body.length < 400 && body.indexOf('<html') === -1){
        var tmp = document.createElement('div');
        tmp.innerHTML = body;
        var txt = (tmp.textContent || '').replace(/\s+/g, ' ').trim();
        if(txt) return txt + (status ? ' (HTTP ' + status + ')' : '');
      }
      if(status === 403) return "You don't have permission to do that (HTTP 403)";
      if(status === 404) return 'Not found (HTTP 404)';
      if(status === 429) return 'Too many requests — please wait a moment (HTTP 429)';
      return 'Something went wrong' + (status ? ' (HTTP ' + status + ')' : '') + '. Please try again.';
    }
    document.body.addEventListener('htmx:responseError', function(e){
      if(e.detail.xhr && e.detail.xhr.status === 401) return; // HX-Redirect to /login handles this
      showToast(messageFromXhr(e.detail.xhr));
    });
    document.body.addEventListener('htmx:sendError', function(){
      showToast('Network error — check your connection and try again.');
    });
    document.body.addEventListener('htmx:timeout', function(){
      showToast('The request timed out. Please try again.');
    });

    /* --- Busy state: mirror htmx-request onto the control that fired the request --- */
    function requester(e){
      var elt = e.detail && e.detail.elt;
      if(!elt) return null;
      if(elt.tagName === 'FORM'){
        return elt.querySelector('button[type="submit"],.btn') || elt;
      }
      return elt.closest('.btn') || elt;
    }
    document.body.addEventListener('htmx:beforeRequest', function(e){
      var el = requester(e); if(el && el.classList) el.classList.add('is-loading');
    });
    document.body.addEventListener('htmx:afterRequest', function(e){
      var el = requester(e); if(el && el.classList) el.classList.remove('is-loading');
    });
  })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
