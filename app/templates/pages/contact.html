<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — LeadBlitz</title>
  <meta name="description" content="Get in touch with LeadBlitz support via email or phone.">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/landing.css">
</head>
<body>
  {% include "partials/public_nav.html" %}

  <!-- Contact -->
  <section class="section">
    <div class="landing-container">
      <p class="section-label">Support</p>
      <h1 class="section-title">Contact us</h1>
      <p class="section-sub">We're here to help. Reach out via email or phone.</p>

      <div style="margin-top:32px;max-width:480px">
        <div style="padding:24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);margin-bottom:16px">
          <p style="font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px">Email</p>
          <a href="mailto:sh@shapplications.com" style="font-size:1.05rem;color:var(--accent);text-decoration:none">sh@shapplications.com</a>
        </div>
        <div style="padding:24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)">
          <p style="font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px">Phone</p>
          <a href="tel:+447427916999" style="font-size:1.05rem;color:var(--accent);text-decoration:none">+44 7427 916999</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="landing-footer">
    <div class="landing-container">
      <div class="footer-top">
        <a href="/" class="logo">LeadBlitz</a>
        <div class="footer-links">
          <a href="/#features">Features</a>
          <a href="/#pricing">Pricing</a>
          <a href="/#faq">FAQ</a>
          <a href="/blog">Blog</a>
          <a href="/score">Free Score</a>
          <a href="/login">Login</a>
          <a href="/privacy">Privacy</a>
          <a href="/contact">Contact</a>
        </div>
      </div>
      <div class="footer-bottom">
        <span>GDPR &amp; CAN-SPAM compliant</span>
      </div>
    </div>
  </footer>
</body>
</html>
