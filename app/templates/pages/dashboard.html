{% extends "base.html" %}
{% block title %}Dashboard — LeadBlitz{% endblock %}
{% block container_class %}container container-wide{% endblock %}

{% block content %}
<div class="section-header">
  <h1>Dashboard</h1>
  <div class="row">
    <a href="/search" class="btn btn-primary btn-sm">Search leads</a>
    <a href="/import" class="btn btn-secondary btn-sm">Import CSV</a>
    <a href="/leads" class="btn btn-secondary btn-sm">View leads</a>
  </div>
</div>

<div id="stats-area" hx-get="/api/stats" hx-trigger="load" hx-swap="innerHTML" aria-live="polite">
  <p class="subtext">Loading stats...</p>
</div>

<div class="mt-32">
  <div class="section-header">
    <h2>Campaigns</h2>
    <a href="/campaigns" class="subtext link-plain">All campaigns &rarr;</a>
  </div>
  <div id="campaign-list" hx-get="/api/campaigns" hx-trigger="load" hx-swap="innerHTML">
    <p class="subtext">Loading...</p>
  </div>
</div>
{% endblock %}
