{% if campaigns %}
  {% for c in campaigns %}
  <div class="card card-compact row row-between">
    <div class="flex-1">
      <span class="fw-600">{{ c.business_type }}</span>
      <span class="subtext">in {{ c.location }}</span>
      <span class="subtext ml-8">{{ c.created_at.strftime('%b %d') }}</span>
    </div>
    <div class="row">
      <a href="/leads?campaign_id={{ c.id }}" class="btn btn-secondary btn-sm">View leads</a>
      <button class="btn btn-danger btn-sm" type="button"
              hx-delete="/api/campaigns/{{ c.id }}"
              hx-confirm="Delete this campaign and all its leads? This cannot be undone."
              hx-target="closest .card"
              hx-swap="outerHTML">Delete</button>
    </div>
  </div>
  {% endfor %}
{% else %}
<div class="empty-state">
  <h3>No campaigns yet</h3>
  <p>Each search you run becomes a campaign you can come back to.</p>
  <div class="row row-center">
    <a href="/search" class="btn btn-primary btn-sm">Run a search <span class="cost">· 1 credit</span></a>
    <a href="/import" class="btn btn-secondary btn-sm">Import CSV</a>
  </div>
</div>
{% endif %}
