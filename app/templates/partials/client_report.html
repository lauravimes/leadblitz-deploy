{% if report_html %}
<div class="card" style="padding:0;overflow:hidden">
  <iframe srcdoc="{{ report_html | e }}" sandbox="" referrerpolicy="no-referrer"
          title="Client audit report preview"
          style="width:100%;min-height:600px;border:none"></iframe>
</div>
{% else %}
<p class="subtext">No report data.</p>
{% endif %}
