{% if transactions %}
<div class="card card-flush">
  {% for t in transactions %}
  <div class="tx-row">
    <div class="flex-1">
      <span class="tx-desc">{{ t.description }}</span>
      <div class="subtext">{{ t.created_at[:10] }}</div>
    </div>
    <span class="tx-amount {{ 'amount-pos' if t.amount > 0 else 'amount-neg' }}">
      {{ '+' if t.amount > 0 }}{{ t.amount }}
    </span>
  </div>
  {% endfor %}
</div>
{% else %}
<p class="subtext">No transactions yet. Credits you buy and spend will show up here.</p>
{% endif %}
